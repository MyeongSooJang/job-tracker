# EC2 한 대에서 앱 + PostgreSQL + Redis + Caddy(HTTPS)를 함께 띄운다.
# 사용: cd /opt/job-tracker && docker compose -f docker-compose.prod.yml --env-file .env up -d
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-ssangtteongnip}
      PGUSER: ${PGUSER:-ssangtteongnip}
      PGPASSWORD: ${PGPASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MAIL_FROM: ${MAIL_FROM}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # 2GB 인스턴스에서 DB·Redis와 메모리를 나눠 쓰므로 힙을 제한한다.
      JAVA_TOOL_OPTIONS: -Xmx768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s

  postgres:
    # Render에서 이전할 DB가 18.x라 메이저 버전을 맞춘다. 낮은 버전으로 복구하면 스키마 구문이 호환되지 않을 수 있다.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-ssangtteongnip}
      POSTGRES_USER: ${PGUSER:-ssangtteongnip}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 호스트(EBS) 경로를 직접 마운트한다.
      # 18부터 이미지의 PGDATA가 /var/lib/postgresql/18/docker 라서 한 단계 위를 마운트한다.
      - /opt/job-tracker/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ssangtteongnip} -d ${PGDATABASE:-ssangtteongnip}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 인증 코드·시도 횟수처럼 잃어도 되는 값만 담으므로 디스크에 저장하지 않는다.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
