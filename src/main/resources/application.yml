spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jobtracker
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

springdoc:
  swagger-ui:
    path: /swagger-ui.html
