plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.15.0'
}

group = 'com.ssangtteongnip'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.eclipse.angus:angus-mail'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.29.20'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// 커버리지는 테스트되지 않은 코드를 찾는 용도다. 유지선은 70%이며 ./gradlew jacocoTestCoverageVerification 으로 확인한다.
// 단언 없는 테스트는 걸러내지 못하므로 뮤테이션 점수(pitest)를 함께 본다.
jacoco {
    toolVersion = '0.8.12'
}

def coverageExcludes = [
        'com/ssangtteongnip/SsangtteongnipApplication.class',
        'com/ssangtteongnip/global/config/**',
        '**/dto/**'
]

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: coverageExcludes)
    }))
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.files.collect {
        fileTree(dir: it, exclude: coverageExcludes)
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

// 비즈니스 규칙이 있는 도메인 패키지만 뮤테이션 테스트한다. 전체 대상은 Spring 테스트가 느려 비실용적이다.
pitest {
    junit5PluginVersion = '1.2.1'
    targetClasses = ['com.ssangtteongnip.domain.*']
    targetTests = ['com.ssangtteongnip.domain.*']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}
